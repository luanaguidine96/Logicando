<div class="topo">
    <p>Um espaço para aprender lógica, desenvolver ideias e se divertir no caminho.</p>
</div>

<!-- MENU -->
<header>

    <div class="logo">
        <img src="/img/logicando.jpg" width="200px" alt="Logicando">
    </div>

    <nav class="nav">
        <a routerLink="/inicio-crianca">INÍCIO</a>
        <a routerLink="/mundo">MUNDO</a>
        <a routerLink="/" (click)="sair()">SAIR</a>
    </nav>

</header>

<main style="text-align: center;">
    <div class="container">

        <h1>MEU MUNDO</h1>
        <p class="page-description">
            ESPAÇO PARA EXPLICAÇÃO DA TRILHA
        </p>

    </div>
</main>

<div class="world" id="world">

    <img src="/img/mapa.png" class="world-line line-1" width="90%" alt="Mapa do mundo">

    <div class="fases">

        @for (fase of fases(); track fase.numero) {
            <div
                [class]="'fase fase' + fase.numero + ' ' + fase.estado"
                [attr.data-fase]="fase.numero"
                (click)="clicarFase($index)"
            >
                <img [src]="imagem(fase)" [alt]="descricao(fase)">

                @if (fase.estado === 'liberada') {
                    <img class="balao-jogue" src="/img/jogue.png" alt="Jogue esta fase">
                }
            </div>
        }

    </div>
</div>
