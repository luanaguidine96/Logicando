<main>
    <form class="container" ngNativeValidate (ngSubmit)="cadastrar()">

        <div class="box form">
            <h1>CADASTRO DO RESPONSÁVEL</h1>

            <div class="field">
                <label for="name">NOME DO RESPONSÁVEL</label>
                <input type="text" id="name" name="name" [(ngModel)]="nome" required>
            </div>

            <div class="field">
                <label for="email">E-MAIL DO RESPONSÁVEL</label>
                <input type="email" id="email" name="email" [(ngModel)]="email" required>
            </div>

            <div class="field">
                <label for="login">LOGIN DO RESPONSÁVEL</label>
                <input type="text" id="login" name="login" [(ngModel)]="login" required>
            </div>

            <div class="field">
                <label for="senha">SENHA DO RESPONSÁVEL</label>
                <input type="password" id="senha" name="senha" [(ngModel)]="senha" required>
            </div>

            <h1>CADASTRO DA CRIANÇA</h1>

            <div class="field">
                <label for="loginCrianca">LOGIN DA CRIANÇA</label>
                <input type="text" id="loginCrianca" name="loginCrianca" [(ngModel)]="loginCrianca" required>
            </div>

            <div class="field">
                <label for="senhaCrianca">SENHA DA CRIANÇA</label>
                <input type="password" id="senhaCrianca" name="senhaCrianca" [(ngModel)]="senhaCrianca" required>
            </div>

            <p role="status">{{ mensagem() }}</p>

            <div class="actions">
                <button type="submit" class="button">
                    CADASTRAR
                </button>

                <a class="button" routerLink="/">
                    VOLTAR
                </a>
            </div>

        </div>
    </form>
</main>
