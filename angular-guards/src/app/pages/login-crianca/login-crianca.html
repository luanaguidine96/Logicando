
<main>

    <div class="topo">
        <p>Um espaço para aprender lógica, desenvolver ideias e se divertir no caminho.</p>
    </div>

    <div class="logo" style="text-align: center;">
        <img src="/img/logicando.jpg" alt="Logicando">
    </div>

    <div class="container">

        <div class="caixa">

            <h1>LOGIN</h1>
            <p class="descricao">ÁREA DA CRIANÇA</p>

            <form (ngSubmit)="entrar()">

                <div class="campo">
                    <label for="login">LOGIN</label>

                    <input
                        type="text"
                        id="login"
                        name="login"
                        [(ngModel)]="login"
                        required
                    >
                </div>

                <div class="campo">
                    <label for="senha">SENHA</label>

                    <input
                        type="password"
                        id="senha"
                        name="senha"
                        [(ngModel)]="senha"
                        required
                    >
                </div>

                <p role="status">{{ mensagem }}</p>

                <div class="botoes">

                    <button
                        class="botao"
                        type="submit"
                    >
                        ENTRAR
                    </button>

                    <a
                        class="botao"
                        routerLink="/"
                    >
                        VOLTAR
                    </a>

                </div>

            </form>

        </div>

        <img
            class="ilustracao"
            src="img/logincriança.png"
            alt="Ilustração da área de login infantil"
        >

    </div>

</main>

<footer class="footer">

    <div class="footer-redes">
        <a href="#" target="_blank">Instagram</a>
        <a href="#" target="_blank">WhatsApp</a>
        <a href="#" target="_blank">TikTok</a>
    </div>

    <div class="footer-autor">
        <p>
            Desenvolvido por <strong>Luana Guidine</strong>
        </p>
    </div>

</footer>
