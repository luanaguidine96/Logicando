<header>
    <div class="container header-content">

        <div class="logo">LOGO</div>

        <nav class="nav">
            <a routerLink="/inicio-crianca">INÍCIO</a>
            <a routerLink="/mundo">MUNDO</a>
            <a routerLink="/" (click)="sair()">SAIR</a>
        </nav>

    </div>
</header>

<main>
    <div class="container">

        <h1>OLÁ, {{ nome }}!</h1>
        <p class="page-description">ESPAÇO PARA UMA FRASE</p>

        <div class="grid grid-2">

            <section class="box">
                <h2>PROGRESSO</h2>
                <p>FASE / NÍVEL</p>

                <div class="progress">
                    <div></div>
                </div>

                <p>____% CONCLUÍDO</p>
            </section>

            <section class="box">
                <h2>CONTINUAR</h2>
                <p>ESPAÇO PARA DESCRIÇÃO DA PRÓXIMA ATIVIDADE</p>

                <div class="actions">
                    <a class="button" routerLink="/mundo">CONTINUAR</a>
                </div>
            </section>

        </div>

        <br>

        <div class="grid grid-3">
            <div class="stat">
                <span class="stat-number">__</span>
                AULAS
            </div>

            <div class="stat">
                <span class="stat-number">__</span>
                DESAFIOS
            </div>

            <div class="stat">
                <span class="stat-number">__</span>
                CONQUISTAS
            </div>
        </div>

    </div>
</main>
